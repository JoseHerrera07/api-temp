<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Clima & Energía</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="brand">
                <span class="material-icons-round">analytics</span>
                <h2>MONITOR PERÚ</h2>
            </div>

            <div class="info-card active-card">
                 <div class="card-header">
                    <span class="material-icons-round" style="color: #3498db;">thermostat</span>
                    <span>Clima Lima</span>
                </div>
                 <div class="card-body">
                    <h3 id="actual-temp">-- °C</h3>
                    <p id="actual-hum">-- % Humedad</p>
                    <p id="actual-hora" style="margin-top:5px; font-weight: bold; font-size: 0.8rem;">--:--</p>
                 </div>
            </div>

            <div class="info-card" style="border-left: 4px solid #8e44ad;">
                <div class="card-header">
                   <span class="material-icons-round" style="color: #8e44ad;">bolt</span>
                   <span>Red Eléctrica (COES)</span>
               </div>
                <div class="card-body">
                   <h3 id="coes-valor" style="color: #8e44ad;">-- MW</h3>
                   <p id="coes-hora" style="font-size: 0.8rem;">Sincronizando...</p>
                </div>
           </div>
            
            <div class="status-bar" id="status">
                Iniciando sistema...
            </div>
            
            <div style="margin-top: auto;">
                 <button onclick="borrarHistorial()" class="btn-reset">
                    <span class="material-icons-round">delete_outline</span> Reiniciar Datos
                </button>
            </div>
        </aside>

        <main class="main-content">
            
            <div class="date-navigator">
                <span style="color: #666; font-weight: 600;">Historial:</span>
                <div id="date-buttons-container" class="date-buttons-list"></div>
            </div>

            <div class="charts-row">
                <div class="chart-box main-chart">
                    <div class="chart-header">
                        <h4>Variación Diaria (Clima)</h4>
                    </div>
                    <div class="canvas-wrapper">
                        <canvas id="graficoClima"></canvas>
                    </div>
                </div>

                <div class="chart-box gauge-box">
                    <div class="chart-header" style="justify-content: center;">
                        <h4>Temp. Máxima</h4>
                    </div>
                    <div class="gauge-container">
                        <canvas id="graficoGauge"></canvas>
                        <div id="gauge-needle" class="needle"></div>
                        <div class="needle-center"></div>
                    </div>
                    <div class="gauge-info">
                        <h2 id="gauge-valor">-- °C</h2>
                        <p id="gauge-hora">Calculando...</p>
                    </div>
                </div>
            </div>

             <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Temperatura</th>
                            <th>Humedad</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-datos-dia"></tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
